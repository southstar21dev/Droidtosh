name: Release

# docs/RELEASING.md: publishing a GitHub release (tag vX.Y.Z, or vX.Y.Z-alpha|beta|rc.N as a pre-release)
# builds both apps at the tag, signs them with the release keys and attaches the APK, the Mac zip
# and droidtosh-update.json, which the in-app updaters read.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and attach assets to
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Semantic versioning (docs/RELEASING.md): the tag must be vX.Y.Z or
      # vX.Y.Z-(alpha|beta|rc).N, match the VERSION file, and be marked as a pre-release
      # exactly when it has a pre-release suffix.
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r version build <<< "$(scripts/version.sh "$TAG")"
          core="${version%%-*}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$core" != "$file" ]; then
            echo "::error::Tag $TAG doesn't match the VERSION file ($file). Set VERSION to $core in the tagged commit."
            exit 1
          fi
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [ "$version" != "$core" ] && [ "$prerelease" != "true" ]; then
            echo "::error::$TAG is a pre-release version; mark the GitHub release as a pre-release."
            exit 1
          fi
          if [ "$version" = "$core" ] && [ "$prerelease" = "true" ]; then
            echo "::error::$TAG is a final version; untick \"Set as a pre-release\" on the GitHub release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      DROIDTOSH_VERSION: ${{ needs.version.outputs.version }}
      DROIDTOSH_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The action's default package list includes `tools`, which current SDK repositories no
      # longer carry.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease
      - name: Rename
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Droidtosh-${DROIDTOSH_VERSION}-${DROIDTOSH_BUILD}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  mac:
    needs: version
    runs-on: macos-26
    env:
      DROIDTOSH_VERSION: ${{ needs.version.outputs.version }}
      DROIDTOSH_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Signing identity
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::MAC_SIGNING_P12_BASE64 is not set; see docs/RELEASING.md"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build
        working-directory: macos
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Droidtosh.xcodeproj -scheme Droidtosh -configuration Release \
            -derivedDataPath build/release \
            MARKETING_VERSION="${DROIDTOSH_VERSION%%-*}" CURRENT_PROJECT_VERSION="$DROIDTOSH_BUILD" \
            DROIDTOSH_VERSION="$DROIDTOSH_VERSION" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" build
      - name: Check the signature and zip
        run: |
          app=macos/build/release/Build/Products/Release/Droidtosh.app
          codesign --verify --deep --strict "$app"
          # The in-app updater pins this certificate (docs/RELEASING.md).
          codesign -d -r- "$app" 2>&1 | grep 'certificate leaf = H"40925259b86c734a3f001ded61bd741ea01d9f98"'
          mkdir dist
          ditto -c -k --keepParent "$app" "dist/Droidtosh-${DROIDTOSH_VERSION}-${DROIDTOSH_BUILD}-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/

  publish:
    needs: [version, android, mac]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      COMMIT: ${{ needs.version.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        working-directory: dist
        run: |
          apk="Droidtosh-${VERSION}-${BUILD}.apk"
          zip="Droidtosh-${VERSION}-${BUILD}-mac.zip"
          jq -n --arg version "$VERSION" --argjson build "$BUILD" --arg commit "$COMMIT" \
            --arg apk "$apk" --arg apk_sha "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --arg zip "$zip" --arg zip_sha "$(sha256sum "$zip" | cut -d' ' -f1)" \
            '{version: $version, build: $build, commit: $commit,
              android: {file: $apk, sha256: $apk_sha}, mac: {file: $zip, sha256: $zip_sha}}' \
            > droidtosh-update.json
          cat droidtosh-update.json
      # The manifest goes last: the apps ignore a release until it has one, so they never see
      # a manifest whose files aren't uploaded yet.
      - name: Attach to the release
        working-directory: dist
        run: |
          gh release upload "$TAG" Droidtosh-*.apk Droidtosh-*-mac.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" droidtosh-update.json --clobber --repo "$GITHUB_REPOSITORY"
