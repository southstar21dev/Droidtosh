name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Vet and test
        working-directory: relay
        run: |
          go vet ./...
          go test -race -count=1 ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # The action's default package list includes `tools`, which current SDK repositories no
      # longer carry, so sdkmanager fails before the build starts.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

  macos-kit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Package.resolved pins swift-collections 1.7.1, which needs Swift tools 6.2. An older Xcode
      # silently resolves 1.6.0 instead and rewrites Package.resolved.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: macos/DroidsyncKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macos/DroidsyncKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Swift tests
        working-directory: macos/DroidsyncKit
        run: swift test

  verify-generated:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Package.resolved pins swift-collections 1.7.1, which needs Swift tools 6.2. An older Xcode
      # silently resolves 1.6.0 instead and rewrites Package.resolved.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: macos/DroidsyncKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macos/DroidsyncKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Install protoc
        run: brew install protobuf
      # generate-swift.sh requires protoc-gen-swift to match swift-protobuf in Package.resolved,
      # so build it from that resolved dependency instead of taking Homebrew's version.
      - name: Build protoc-gen-swift
        working-directory: macos/DroidsyncKit
        run: |
          swift build -c release --product protoc-gen-swift
          echo "$(swift build -c release --show-bin-path)" >> "$GITHUB_PATH"
      - name: Regenerate and diff
        run: make verify-generated

  e2e:
    runs-on: macos-26
    needs: [relay, android, macos-kit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Package.resolved pins swift-collections 1.7.1, which needs Swift tools 6.2. An older Xcode
      # silently resolves 1.6.0 instead and rewrites Package.resolved.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # The action's default package list includes `tools`, which current SDK repositories no
      # longer carry, so sdkmanager fails before the build starts.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: macos/DroidsyncKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macos/DroidsyncKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: End-to-end
        run: make e2e
